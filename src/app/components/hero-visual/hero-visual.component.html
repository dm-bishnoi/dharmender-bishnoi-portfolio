<div class="hero-visual" [class.mobile]="isMobile" [class.reduced]="prefersReducedMotion">
  <!-- Atmospheric glow layers -->
  <div class="hv-glow hv-glow--primary" aria-hidden="true"></div>
  <div class="hv-glow hv-glow--secondary" aria-hidden="true"></div>
  <div class="hv-glow hv-glow--gold" aria-hidden="true"></div>

  <div class="hero-visual-scene">

    <!-- Background: tech grid + orbital rings -->
    <svg class="hero-visual-grid" viewBox="0 0 600 460" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="atm-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.8" fill="rgba(240, 237, 232, 0.1)" />
        </pattern>
        <radialGradient id="atm-halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(212, 98, 26, 0.18)" />
          <stop offset="50%" stop-color="rgba(212, 98, 26, 0.05)" />
          <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
        </radialGradient>
        <radialGradient id="gold-halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(200, 169, 110, 0.12)" />
          <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
        </radialGradient>
        <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Dot field -->
      <rect x="70" y="50" width="460" height="360" fill="url(#atm-dots)" opacity="0.65" />

      <!-- Concentric orbital rings (slowly rotating) -->
      <g class="orbit-group">
        <circle cx="300" cy="230" r="170" fill="none" stroke="rgba(240, 237, 232, 0.06)" stroke-width="1" />
        <circle cx="300" cy="230" r="120" fill="none" stroke="rgba(240, 237, 232, 0.09)" stroke-width="1" stroke-dasharray="3 5" />
        <circle cx="300" cy="230" r="62" fill="none" stroke="rgba(240, 237, 232, 0.11)" stroke-width="1" />
      </g>

      <!-- Soft center glow -->
      <circle cx="300" cy="230" r="110" fill="url(#atm-halo)" />

      <!-- Connection lines from center to primary nodes -->
      <g class="connections" stroke="rgba(240, 237, 232, 0.12)" stroke-width="1" fill="none">
        <line class="conn conn--1" x1="300" y1="230" x2="215" y2="162" />
        <line class="conn conn--2" x1="300" y1="230" x2="385" y2="162" />
        <line class="conn conn--3" x1="300" y1="230" x2="215" y2="298" />
        <line class="conn conn--4" x1="300" y1="230" x2="385" y2="298" />
        <!-- Secondary connections -->
        <line class="conn conn--5" x1="300" y1="230" x2="300" y2="100" stroke-dasharray="3 4" opacity="0.5" />
        <line class="conn conn--6" x1="300" y1="230" x2="440" y2="230" stroke-dasharray="3 4" opacity="0.5" />
        <line class="conn conn--7" x1="300" y1="230" x2="300" y2="360" stroke-dasharray="3 4" opacity="0.5" />
        <line class="conn conn--8" x1="300" y1="230" x2="160" y2="230" stroke-dasharray="3 4" opacity="0.5" />
        <!-- Outer mesh -->
        <line x1="215" y1="162" x2="385" y2="162" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="385" y1="162" x2="440" y2="230" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="385" y1="298" x2="440" y2="230" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="385" y1="298" x2="300" y2="360" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="215" y1="298" x2="300" y2="360" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="215" y1="298" x2="160" y2="230" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="215" y1="162" x2="160" y2="230" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="215" y1="162" x2="300" y2="100" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="385" y1="162" x2="300" y2="100" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="215" y1="298" x2="300" y2="360" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="385" y1="298" x2="300" y2="360" stroke="rgba(240, 237, 232, 0.05)" stroke-width="0.75" />
        <line x1="215" y1="162" x2="160" y2="230" stroke="rgba(240, 237, 232, 0.04)" stroke-width="0.5" />
        <line x1="385" y1="162" x2="440" y2="230" stroke="rgba(240, 237, 232, 0.04)" stroke-width="0.5" />
        <line x1="215" y1="298" x2="160" y2="230" stroke="rgba(240, 237, 232, 0.04)" stroke-width="0.5" />
        <line x1="385" y1="298" x2="440" y2="230" stroke="rgba(240, 237, 232, 0.04)" stroke-width="0.5" />
      </g>

      <!-- Animated data flow pulses -->
      <g class="pulse-streams" stroke="rgba(212, 98, 26, 0.9)" stroke-width="1.5" stroke-linecap="round" fill="none">
        <line class="pulse-line pulse-line--1" x1="300" y1="230" x2="215" y2="162" stroke-dasharray="8 90" />
        <line class="pulse-line pulse-line--2" x1="300" y1="230" x2="385" y2="162" stroke-dasharray="8 90" />
        <line class="pulse-line pulse-line--3" x1="300" y1="230" x2="215" y2="298" stroke-dasharray="8 90" />
        <line class="pulse-line pulse-line--4" x1="300" y1="230" x2="385" y2="298" stroke-dasharray="8 90" />
        <line class="pulse-line pulse-line--5" x1="300" y1="230" x2="300" y2="100" stroke-dasharray="6 110" />
        <line class="pulse-line pulse-line--6" x1="300" y1="230" x2="440" y2="230" stroke-dasharray="6 120" />
        <line class="pulse-line pulse-line--7" x1="300" y1="230" x2="300" y2="360" stroke-dasharray="6 110" />
        <line class="pulse-line pulse-line--8" x1="300" y1="230" x2="160" y2="230" stroke-dasharray="6 120" />
      </g>

      <!-- Corner coordinate framing -->
      <g class="corner-frame" stroke="rgba(240, 237, 232, 0.25)" stroke-width="1">
        <path d="M 80 58 L 80 72 M 66 72 L 80 72" />
        <path d="M 520 58 L 520 72 M 534 72 L 520 72" />
        <path d="M 80 402 L 80 388 M 66 388 L 80 388" />
        <path d="M 520 402 L 520 388 M 534 388 L 520 388" />
      </g>

      <!-- Technical labels -->
      <text x="90" y="50" fill="rgba(240, 237, 232, 0.3)" font-family="var(--font-mono)" font-size="8.5" letter-spacing="0.14em">
        SYS.ARCH // ANGULAR
      </text>
      <text x="510" y="50" text-anchor="end" fill="rgba(240, 237, 232, 0.3)" font-family="var(--font-mono)" font-size="8.5" letter-spacing="0.14em">
        v20.2 · STANDALONE
      </text>
      <text x="90" y="420" fill="rgba(240, 237, 232, 0.25)" font-family="var(--font-mono)" font-size="8.5" letter-spacing="0.12em">
        ENTERPRISE RUNTIME
      </text>
      <text x="510" y="420" text-anchor="end" fill="rgba(240, 237, 232, 0.25)" font-family="var(--font-mono)" font-size="8.5" letter-spacing="0.12em">
        PRODUCTION READY
      </text>
    </svg>

    <!-- Center node: Angular Core (highest elevation) -->
    <div class="node node--core">
      <div class="node-glow"></div>
      <div class="node-core-card">
        <div class="node-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M12 2 L21 6.5 V17.5 L12 22 L3 17.5 V6.5 Z" />
            <path d="M3 6.5 L12 11 L21 6.5 M12 11 V22" />
          </svg>
        </div>
        <div class="node-text">
          <span class="node-title">Angular Core</span>
          <span class="node-meta">Component Architecture</span>
        </div>
      </div>
    </div>

    <!-- Layer 1: 4 primary nodes -->
    <div class="node node--chip node--nw" (mouseenter)="onNodeHover('Components')" (mouseleave)="onNodeLeave()">
      <span class="chip-pulse"></span>
      <span class="chip-label">Components</span>
    </div>
    <div class="node node--chip node--ne" (mouseenter)="onNodeHover('Services')" (mouseleave)="onNodeLeave()">
      <span class="chip-pulse"></span>
      <span class="chip-label">Services</span>
    </div>
    <div class="node node--chip node--sw" (mouseenter)="onNodeHover('Directives')" (mouseleave)="onNodeLeave()">
      <span class="chip-pulse"></span>
      <span class="chip-label">Directives</span>
    </div>
    <div class="node node--chip node--se" (mouseenter)="onNodeHover('Pipes')" (mouseleave)="onNodeLeave()">
      <span class="chip-pulse"></span>
      <span class="chip-label">Pipes</span>
    </div>

    <!-- Layer 2: 4 supporting nodes -->
    <div class="node node--chip-sub node--n" (mouseenter)="onNodeHover('Routing')" (mouseleave)="onNodeLeave()">
      <span class="chip-dot"></span>
      <span class="chip-label">Routing</span>
    </div>
    <div class="node node--chip-sub node--e" (mouseenter)="onNodeHover('RxJS')" (mouseleave)="onNodeLeave()">
      <span class="chip-dot"></span>
      <span class="chip-label">RxJS</span>
    </div>
    <div class="node node--chip-sub node--s" (mouseenter)="onNodeHover('Testing')" (mouseleave)="onNodeLeave()">
      <span class="chip-dot"></span>
      <span class="chip-label">Testing</span>
    </div>
    <div class="node node--chip-sub node--w" (mouseenter)="onNodeHover('Forms')" (mouseleave)="onNodeLeave()">
      <span class="chip-dot"></span>
      <span class="chip-label">Forms</span>
    </div>

    <!-- Floating depth particles -->
    <div class="depth-particle particle--1"></div>
    <div class="depth-particle particle--2"></div>
    <div class="depth-particle particle--3"></div>
    <div class="depth-particle particle--4"></div>

    <!-- Status footer -->
    <div class="hero-visual-footer">
      <span class="live-beacon"></span>
      <span class="footer-text">State &amp; Component Graph Active</span>
    </div>
  </div>
</div>
