<div class="hero-visual" [class.mobile]="isMobile" [class.reduced]="prefersReducedMotion">

  <!-- Atmospheric glow layers (always visible) -->
  <div class="hv-glow hv-glow--primary"  aria-hidden="true"></div>
  <div class="hv-glow hv-glow--secondary" aria-hidden="true"></div>
  <div class="hv-glow hv-glow--blue"     aria-hidden="true"></div>

  <!-- 3D scene wrapper — receives pointer/idle transform from hero-visual.component.ts -->
  <div class="hero-visual-scene">

    <!-- SVG fallback: reduced-motion or WebGL init failure -->
    <div class="laptop-fallback-wrap" *ngIf="prefersReducedMotion || webglFailed">
      <app-hero-visual-fallback></app-hero-visual-fallback>
    </div>

    <!-- Three.js canvas injected here imperatively in initThree() -->

    <!-- Floating depth particles (atmospheric) -->
    <div class="depth-particle particle--1" aria-hidden="true"></div>
    <div class="depth-particle particle--2" aria-hidden="true"></div>
    <div class="depth-particle particle--3" aria-hidden="true"></div>
    <div class="depth-particle particle--4" aria-hidden="true"></div>
  </div>

</div>
