<section id="projects" class="projects sec sec--wide">

  <div class="projects-head reveal-up">
    <div class="projects-statement">
      <h2 class="display-2 projects-headline">
        Selected<br />
        <em class="heading-accent">Case Study.</em>
      </h2>
    </div>
  </div>

  <article class="case">
    <div class="case-layout">

      <!-- Left: Architectural visualization (Sticky) -->
      <div class="case-visual-container">
        <div class="case-visual magnetic interactive glass glass-prominent" data-cursor-text="View">
        <svg class="case-visual-svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <radialGradient id="caseHalo" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(86, 156, 255, 0.20)"/>
              <stop offset="100%" stop-color="rgba(86, 156, 255, 0)"/>
            </radialGradient>
            <pattern id="caseDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
              <circle cx="1" cy="1" r="0.7" fill="rgba(240, 237, 232, 0.10)"/>
            </pattern>
            <linearGradient id="caseLine" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(86, 156, 255, 0)"/>
              <stop offset="50%" stop-color="rgba(86, 156, 255, 0.6)"/>
              <stop offset="100%" stop-color="rgba(86, 156, 255, 0)"/>
            </linearGradient>
          </defs>
          <rect width="600" height="360" fill="url(#caseDots)" opacity="0.5"/>
          <ellipse cx="300" cy="180" rx="260" ry="120" fill="url(#caseHalo)"/>
          
          <line x1="40" y1="42" x2="180" y2="42" stroke="url(#caseLine)" stroke-width="1"/>
          <text x="40" y="34" fill="rgba(240, 237, 232, 0.4)" font-family="var(--font-mono)" font-size="10" letter-spacing="0.16em">{{ projects[activeProjectIndex].title | uppercase }}</text>
          <text x="560" y="34" text-anchor="end" fill="rgba(86, 156, 255, 0.6)" font-family="var(--font-mono)" font-size="10" letter-spacing="0.14em">v20 · STANDALONE</text>

          <g stroke="rgba(86, 156, 255, 0.25)" stroke-width="0.75" fill="none">
            <rect x="60" y="80" width="200" height="60" rx="4"/>
            <rect x="270" y="80" width="160" height="60" rx="4"/>
            <rect x="440" y="80" width="100" height="60" rx="4"/>
            <rect x="60" y="150" width="140" height="60" rx="4"/>
            <rect x="210" y="150" width="220" height="60" rx="4"/>
            <rect x="440" y="150" width="100" height="60" rx="4"/>
            <rect x="60" y="220" width="180" height="60" rx="4"/>
            <rect x="250" y="220" width="180" height="60" rx="4"/>
            <rect x="440" y="220" width="100" height="60" rx="4"/>
          </g>

          <g fill="rgba(240, 237, 232, 0.5)" font-family="var(--font-mono)" font-size="9" letter-spacing="0.1em">
            <text x="72" y="115">CONTACTS</text>
            <text x="282" y="115">DEALS</text>
            <text x="452" y="115">TASKS</text>
            <text x="72" y="185">REPORTS</text>
            <text x="222" y="185">WORKFLOW</text>
            <text x="452" y="185">NOTES</text>
            <text x="72" y="255">RBAC</text>
            <text x="262" y="255">AUDIT</text>
            <text x="452" y="255">API</text>
          </g>

          <g fill="rgba(86, 156, 255, 0.15)" stroke="rgba(86, 156, 255, 0.5)" stroke-width="0.75">
            <rect x="210" y="150" width="220" height="60" rx="4"/>
          </g>

          <g stroke="rgba(86, 156, 255, 0.4)" stroke-width="1" fill="none" stroke-dasharray="2 4">
            <path d="M 160 140 L 160 150"/>
            <path d="M 350 140 L 350 150"/>
            <path d="M 320 210 L 320 220"/>
            <path d="M 490 210 L 490 220"/>
          </g>

          <text x="40" y="340" fill="rgba(240, 237, 232, 0.3)" font-family="var(--font-mono)" font-size="9" letter-spacing="0.12em">ENTERPRISE SCALE · PRODUCTION</text>
          <text x="560" y="340" text-anchor="end" fill="rgba(86, 156, 255, 0.5)" font-family="var(--font-mono)" font-size="9" letter-spacing="0.12em">RXJS · NG_RX</text>
        </svg>

        <!-- Glass Metadata Layer -->
        <div class="case-visual-meta glass glass-prominent">
          <div class="meta-row">
            <span class="meta-label">System</span>
            <span class="meta-value">{{ projects[activeProjectIndex].title }}</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Focus</span>
            <span class="meta-value">{{ projects[activeProjectIndex].subtitle }}</span>
          </div>
        </div>

        </div>
      </div>

      <!-- Right: Scrolling Projects -->
      <div class="case-list">
        <div class="case-content glass glass-subtle project-item" 
             *ngFor="let p of projects; let i = index"
             #projectEl
             [attr.data-index]="i"
             [class.is-active]="i === activeProjectIndex">
          
          <header class="case-head">
            <div class="case-head-meta">
              <h3 class="case-title">{{ p.title }}</h3>
              <p class="case-subtitle">{{ p.subtitle }}</p>
            </div>
          </header>

          <p class="case-lede">{{ p.lede }}</p>

          <div class="case-detail">
            <div class="case-detail-item">
              <span class="case-detail-label">Contribution</span>
              <p class="case-detail-text">{{ p.contribution }}</p>
            </div>

            <div class="case-detail-item">
              <span class="case-detail-label">Stack</span>
              <div class="case-detail-tech">
                <span *ngFor="let tech of p.stack">{{ tech }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </article>

</section>
