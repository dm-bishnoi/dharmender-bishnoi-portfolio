<header class="site-header" [class.scrolled]="isScrolled" [class.menu-open]="menuOpen">
  <!-- DB Monogram (left) -->
  <a class="monogram" href="#home" aria-label="Dharmender Bishnoi — home">
    <span class="monogram-ring" aria-hidden="true"></span>
    <span class="monogram-text">DB</span>
  </a>

  <!-- Primary navigation (right) -->
  <nav class="site-nav"
       [class.open]="menuOpen"
       aria-label="Primary navigation"
       id="primary-nav">
    <ol class="nav-list">
      <li *ngFor="let link of navLinks">
        <a [href]="'#' + link.id"
           (click)="closeMenu()"
           [class.active]="activeSection === link.id"
           class="nav-link">
          <span class="nav-link-num">{{ link.num }}</span>
          <span class="nav-link-text">{{ link.label }}</span>
          <span class="nav-link-indicator" aria-hidden="true"></span>
        </a>
      </li>
    </ol>
  </nav>

  <!-- Right side icon group -->
  <div class="header-actions">
    <a class="header-icon"
       href="https://github.com/dm-bishnoi"
       target="_blank" rel="noopener noreferrer"
       aria-label="GitHub">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.04c-3.2.69-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.18.92-.26 1.91-.39 2.89-.39.98 0 1.97.13 2.89.39 2.2-1.49 3.16-1.18 3.16-1.18.62 1.58.23 2.75.11 3.04.74.81 1.18 1.84 1.18 3.1 0 4.42-2.7 5.4-5.27 5.69.41.35.78 1.05.78 2.12v3.14c0 .31.21.68.8.56C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/>
      </svg>
    </a>
    <a class="header-icon"
       href="https://www.linkedin.com/in/dharmender-bishnoi-7ba664176"
       target="_blank" rel="noopener noreferrer"
       aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM10 9h3.6v1.7h.05c.5-.95 1.72-1.95 3.55-1.95 3.8 0 4.5 2.5 4.5 5.75V21H17.7v-5.7c0-1.36-.03-3.1-1.9-3.1-1.9 0-2.2 1.48-2.2 3v5.8H10z"/>
      </svg>
    </a>
    <button type="button"
            class="hamburger"
            [class.open]="menuOpen"
            (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen"
            aria-controls="primary-nav"
            aria-label="Toggle navigation menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
