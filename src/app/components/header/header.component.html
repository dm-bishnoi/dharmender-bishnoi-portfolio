<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header" [class.scrolled]="isScrolled" [class.menu-open]="menuOpen">
  <a class="header-name" href="#home" aria-label="Dharmender Bishnoi — home">
    <span class="header-name-mark">DB</span>
    <span class="header-name-text">
      Dharmender<span class="header-name__last"> Bishnoi</span>
    </span>
  </a>

  <nav class="site-nav"
       [class.open]="menuOpen"
       aria-label="Primary navigation"
       id="primary-nav">
    <ol class="nav-list">
      <li *ngFor="let link of navLinks">
        <a [href]="'#' + link.id"
           (click)="closeMenu()"
           [class.active]="activeSection === link.id"
           class="nav-link">
          <span class="nav-link-num">{{ navNumber(link.id) }}</span>
          <span class="nav-link-text">{{ link.label }}</span>
          <span class="nav-link-indicator" aria-hidden="true"></span>
        </a>
      </li>
    </ol>

    <a class="nav-cta"
       href="mailto:bishnoid770&#64;gmail.com?subject=Opportunity%20for%20Dharmender%20Bishnoi"
       (click)="closeMenu()">
      <span class="nav-cta-dot"></span>
      Get in touch
    </a>
  </nav>

  <a class="header-cta"
     href="mailto:bishnoid770&#64;gmail.com?subject=Opportunity%20for%20Dharmender%20Bishnoi">
    <span class="header-cta-dot"></span>
    Get in touch
  </a>

  <button type="button"
          class="hamburger"
          [class.open]="menuOpen"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen"
          aria-controls="primary-nav"
          aria-label="Toggle navigation menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>
