<section id="home" class="hero sec sec--hero" aria-label="Hero — Dharmender Bishnoi, Angular Developer">

  <!-- Three.js 3D scene — background particle layer (unaffected by sticky stage) -->
  <app-hero-scene></app-hero-scene>

  <!-- 200vh scroll area; the sticky child inside holds the visual stage pinned. -->
  <div class="hero-stage">
    <div class="hero-stage-sticky">

      <div class="hero-inner">

        <!-- Left content column (text + CTAs) — always visible, no JS dependency. -->
        <div class="hero-content-left">
          <div class="hero-meta" data-hero-reveal="meta">
            <span class="hero-status">
              <span class="hero-status-dot" aria-hidden="true"></span>
              Available for new opportunities
            </span>
          </div>

          <h1 class="display-1 hero-title" data-hero-reveal="identity">
            <span class="hero-title-line">Dharmender</span>
            <span class="hero-title-line">Bishnoi</span>
          </h1>

          <p class="lede hero-lede" data-hero-reveal="statement">
            Frontend engineer specializing in <strong>Angular</strong> architecture, reactive state management, and cinematic user experiences.
          </p>

          <div class="hero-actions" data-hero-reveal="foot">
            <a class="btn btn-primary magnetic glass glass-prominent" href="#projects">
              View Selected Work
            </a>
            <a class="btn btn-outline magnetic glass glass-subtle" href="#contact">
              Let's Talk
            </a>
          </div>
        </div>

        <!-- Right visual stage — relative-positioned, scroll-driven via storytelling wrapper. -->
        <div class="hero-visual-stage" aria-hidden="true">
          <app-hero-storytelling></app-hero-storytelling>
        </div>

      </div>

      <div class="hero-scroll-indicator">
        <span class="hero-scroll-text">Scroll to explore</span>
        <div class="hero-scroll-line"></div>
      </div>

    </div>
  </div>

</section>
