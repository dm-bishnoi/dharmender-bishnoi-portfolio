<section id="home" class="hero" aria-label="Hero — Dharmender Bishnoi, Senior Angular Developer">

  <!-- Cinematic atmospheric glow — large soft blue light behind text -->
  <div class="hero-atm" aria-hidden="true">
    <div class="hero-atm-glow hero-atm-glow--a"></div>
    <div class="hero-atm-glow hero-atm-glow--b"></div>
    <div class="hero-atm-glow hero-atm-glow--c"></div>
    <div class="hero-atm-glow hero-atm-glow--d"></div>
  </div>

  <!-- Decorative technical ticks along the side rail -->
  <div class="hero-rail hero-rail--left" aria-hidden="true">
    <span class="hero-rail-line"></span>
    <span class="hero-rail-tick"></span>
    <span class="hero-rail-tick"></span>
    <span class="hero-rail-tick"></span>
  </div>
  <div class="hero-rail hero-rail--right" aria-hidden="true">
    <span class="hero-rail-line"></span>
    <span class="hero-rail-tick"></span>
    <span class="hero-rail-tick"></span>
    <span class="hero-rail-tick"></span>
  </div>

  <div class="hero-inner">

    <!-- Top meta strip -->
    <div class="hero-meta reveal-fade">
      <span class="hero-meta-num">01 / 05</span>
      <span class="hero-meta-sep" aria-hidden="true"></span>
      <span class="hero-meta-label">Portfolio · Senior Angular Developer</span>
      <span class="hero-meta-sep hero-meta-sep--hide" aria-hidden="true"></span>
      <span class="hero-meta-status">
        <span class="hero-meta-status-dot" aria-hidden="true"></span>
        Available for senior roles · 2026
      </span>
    </div>

    <!-- The display — the dotted NAME is the dominant visual identity,
         with solid SENIOR / ANGULAR / DEVELOPER as refined subtitle type above it. -->
    <div class="hero-display">
      <h1 class="hero-display__title">
        <span class="hero-display__line hero-display__line--solid">
          <span class="hero-display__line-main">SENIOR</span>
          <span class="hero-display__line-main hero-display__line-main--accent">ANGULAR</span>
          <span class="hero-display__line-sub">DEVELOPER</span>
        </span>
        <span class="hero-display__line hero-display__line--name">
          <span class="hero-display__name-dotted">
            <app-dotted-text
              text="DHARMENDER"
              [pixelSize]="10"
              [dotRadius]="2.2"
              [aspectRatio]="0.28"
              color="#f3f6fc"
              [revealDelay]="400"
              [revealDuration]="1400">
            </app-dotted-text>
          </span>
          <span class="hero-display__name-dotted">
            <app-dotted-text
              text="BISHNOI"
              [pixelSize]="10"
              [dotRadius]="2.2"
              [aspectRatio]="0.28"
              color="#f3f6fc"
              [revealDelay]="620"
              [revealDuration]="1400">
            </app-dotted-text>
          </span>
        </span>
      </h1>
    </div>

    <!-- Bottom: side info + CTA + socials -->
    <div class="hero-foot">

      <div class="hero-foot-left reveal-left">
        <p class="hero-statement">
          <span class="hero-statement-line">I build Angular</span>
          <span class="hero-statement-line">applications</span>
          <span class="hero-statement-line hero-statement-line--accent">that ship.</span>
        </p>
      </div>

      <div class="hero-foot-right reveal-right">
        <a class="hero-cta" href="#projects">
          <span class="hero-cta-label">View Selected Work</span>
          <span class="hero-cta-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 5l7 7-7 7"/>
            </svg>
          </span>
        </a>

        <div class="hero-social">
          <a class="hero-social-icon"
             href="https://github.com/dm-bishnoi"
             target="_blank" rel="noopener noreferrer"
             aria-label="GitHub">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.04c-3.2.69-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.18.92-.26 1.91-.39 2.89-.39.98 0 1.97.13 2.89.39 2.2-1.49 3.16-1.18 3.16-1.18.62 1.58.23 2.75.11 3.04.74.81 1.18 1.84 1.18 3.1 0 4.42-2.7 5.4-5.27 5.69.41.35.78 1.05.78 2.12v3.14c0 .31.21.68.8.56C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/>
            </svg>
            <span class="hero-social-icon-label">GitHub</span>
          </a>
          <a class="hero-social-icon"
             href="https://www.linkedin.com/in/dharmender-bishnoi-7ba664176"
             target="_blank" rel="noopener noreferrer"
             aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM10 9h3.6v1.7h.05c.5-.95 1.72-1.95 3.55-1.95 3.8 0 4.5 2.5 4.5 5.75V21H17.7v-5.7c0-1.36-.03-3.1-1.9-3.1-1.9 0-2.2 1.48-2.2 3v5.8H10z"/>
            </svg>
            <span class="hero-social-icon-label">LinkedIn</span>
          </a>
          <a class="hero-social-icon"
             href="mailto:bishnoid770&#64;gmail.com?subject=Opportunity%20for%20Dharmender%20Bishnoi"
             aria-label="Email">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M3 7l9 6 9-6" />
            </svg>
            <span class="hero-social-icon-label">Email</span>
          </a>
        </div>
      </div>

    </div>

  </div>

</section>
